[tools]

[env]
PROJECT_NAME = "Vivira"
SCHEME = "Vivira"
SIM_DEVICE = "iPhone 17"  # adjust to a simulator you have installed (xcrun simctl list devices)
EXTRA_SWIFT_FLAGS = ""  # set in mise.local.toml when xcodebuild itself runs inside an outer sandbox (e.g. -disable-sandbox)

[tasks.bootstrap]
description = "First-time setup: install brew deps and generate the Xcode project"
run = """
set -euo pipefail
command -v brew >/dev/null || { echo "Install Homebrew first: https://brew.sh"; exit 1; }
brew install --quiet swiftlint xcbeautify
mise run generate
"""

[tasks.generate]
description = "Regenerate Vivira.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.open]
description = "Open the project in Xcode"
depends = ["generate"]
run = "open $PROJECT_NAME.xcodeproj"

[tasks.build]
description = "Build for iOS Simulator"
depends = ["generate"]
run = '''
xcodebuild build \
  -project $PROJECT_NAME.xcodeproj \
  -scheme $SCHEME \
  -destination 'generic/platform=iOS Simulator' \
  OTHER_SWIFT_FLAGS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
  | xcbeautify
'''

# Snapshot test workflow
#
# Snapshot baselines (PNGs under __Snapshots__/) are committed to git and
# are the source of truth for what the UI is expected to look like. A
# failed snapshot test is a signal — either the UI regressed, or it was
# changed intentionally and the references are stale. The dev or reviewer
# decides which. See CONTRIBUTING.md for the full workflow.
#
# `mise run test`        strict; never auto-records; missing baselines fail.
# `mise run test:record` wipes __Snapshots__/ and re-records, then prints
#                        next-steps (review the diff, accept with git add
#                        or reject with git restore, commit alongside code).
# `mise run test:diff`   shows which baselines differ from HEAD.

[tasks.test]
description = "Run unit tests on $SIM_DEVICE (strict: fails on missing or differing snapshot baselines)"
depends = ["generate"]
run = '''
set -euo pipefail

SNAPSHOT_TESTING_RECORD_MODE=never xcodebuild test \
  -project $PROJECT_NAME.xcodeproj \
  -scheme $SCHEME \
  -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
  OTHER_SWIFT_FLAGS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
  | xcbeautify
'''

[tasks."test:record"]
description = "Wipe and re-record all snapshot baselines (use after intentional visual changes)"
depends = ["generate"]
run = '''
set -euo pipefail

SNAPSHOT_DIR="Packages/ViviraDesignSystem/Tests/ViviraDesignSystemTests/__Snapshots__"

echo "Removing existing snapshot baselines under $SNAPSHOT_DIR..."
rm -rf "$SNAPSHOT_DIR"

echo "Re-running tests to record fresh baselines (the failure that follows is the recording event, not a defect)..."
SNAPSHOT_TESTING_RECORD_MODE=missing xcodebuild test \
  -project $PROJECT_NAME.xcodeproj \
  -scheme $SCHEME \
  -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
  OTHER_SWIFT_FLAGS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
  | xcbeautify || true

cat <<'NEXT'

────────────────────────────────────────────────────────────────────────
Recording complete. Next steps:

  1. Inspect each new baseline:
     mise run test:diff

  2. For every changed PNG, decide:
       Intentional change → git add <path>
       Accidental change  → git restore <path>, then fix the code

  3. Confirm strict tests pass against the accepted baselines:
     mise run test

  4. Commit the accepted PNGs alongside the code change that produced them.

See CONTRIBUTING.md for the full workflow.
────────────────────────────────────────────────────────────────────────
NEXT
'''

[tasks."test:diff"]
description = "Show which snapshot baselines have changed since HEAD"
run = '''
SNAPSHOT_DIR="Packages/ViviraDesignSystem/Tests/ViviraDesignSystemTests/__Snapshots__"
if [ -z "$(git status --porcelain -- "$SNAPSHOT_DIR")" ]; then
  echo "No baseline changes under $SNAPSHOT_DIR."
else
  git status --short -- "$SNAPSHOT_DIR"
fi
'''

[tasks.lint]
description = "Run SwiftLint"
run = "swiftlint"

[tasks."lint:fix"]
description = "Auto-fix SwiftLint violations"
run = "swiftlint --fix"

[tasks.clean]
description = "Remove generated Xcode project and this app's DerivedData"
run = """
rm -rf $PROJECT_NAME.xcodeproj
rm -rf ~/Library/Developer/Xcode/DerivedData/${PROJECT_NAME}-*
"""

[tasks.gen-colors]
description = "Regenerate ViviraColors.xcassets from tools/colors-source.json (one-off; run when colors change)"
run = """
set -euo pipefail
if [ ! -d tools/node_modules ]; then
  (cd tools && npm install)
fi
node tools/oklch-to-p3.mjs
"""
