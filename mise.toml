[tools]

[env]
PROJECT_NAME = "Vivira"
SCHEME = "Vivira"
SIM_DEVICE = "iPhone 17"  # adjust to a simulator you have installed (xcrun simctl list devices)
EXTRA_SWIFT_FLAGS = ""  # set in mise.local.toml when xcodebuild itself runs inside an outer sandbox (e.g. -disable-sandbox)

[tasks.bootstrap]
description = "First-time setup: install brew deps and generate the Xcode project"
run = """
set -euo pipefail
command -v brew >/dev/null || { echo "Install Homebrew first: https://brew.sh"; exit 1; }
brew install --quiet swiftlint xcbeautify
mise run generate
"""

[tasks.generate]
description = "Regenerate Vivira.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.open]
description = "Open the project in Xcode"
depends = ["generate"]
run = "open $PROJECT_NAME.xcodeproj"

[tasks.build]
description = "Build for iOS Simulator"
depends = ["generate"]
run = '''
xcodebuild build \
  -project $PROJECT_NAME.xcodeproj \
  -scheme $SCHEME \
  -destination 'generic/platform=iOS Simulator' \
  OTHER_SWIFT_FLAGS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
  | xcbeautify
'''

[tasks.test]
description = "Run unit tests on $SIM_DEVICE (app on simulator + design system on host; see spec §6.2 about snapshot tests)"
depends = ["generate"]
run = '''
set -euo pipefail

# Run the app's tests (ViviraTests.smoke) on the iOS simulator.
xcodebuild test \
  -project $PROJECT_NAME.xcodeproj \
  -scheme $SCHEME \
  -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
  OTHER_SWIFT_FLAGS="\$(inherited) $EXTRA_SWIFT_FLAGS" \
  | xcbeautify

# Run the design system's host-runnable tests (ThemeStorage). The snapshot
# tests are #if canImport(UIKit)-gated and only compile against iOS; they
# require an Xcode scheme that builds the package test target for the
# simulator. Wiring that scheme is tracked as a follow-up in the tracer
# bullet spec §6.2.
swift test --package-path Packages/ViviraDesignSystem
'''

[tasks.lint]
description = "Run SwiftLint"
run = "swiftlint"

[tasks."lint:fix"]
description = "Auto-fix SwiftLint violations"
run = "swiftlint --fix"

[tasks.clean]
description = "Remove generated Xcode project and this app's DerivedData"
run = """
rm -rf $PROJECT_NAME.xcodeproj
rm -rf ~/Library/Developer/Xcode/DerivedData/${PROJECT_NAME}-*
"""

[tasks.gen-colors]
description = "Regenerate ViviraColors.xcassets from tools/colors-source.json (one-off; run when colors change)"
run = """
set -euo pipefail
if [ ! -d tools/node_modules ]; then
  (cd tools && npm install)
fi
node tools/oklch-to-p3.mjs
"""
